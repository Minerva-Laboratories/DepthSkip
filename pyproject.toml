[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "terrace"
version = "0.1.0"
description = "Training-free layer skipping for the prompt pass of hybrid DeltaNet/attention LMs (graded per-token depth, part skips)."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["torch>=2.4", "transformers>=5.2", "numpy"]

[project.optional-dependencies]
experiments = ["pyarrow", "datasets"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA and a real checkpoint"]
filterwarnings = ["ignore::UserWarning"]
